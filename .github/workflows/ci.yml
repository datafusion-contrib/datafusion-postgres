name: CI
on:
  schedule: [{cron: "30 13 * * *"}]
  push:
    branches:
      - master
  pull_request:

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt
        override: true
    - run: cargo fmt -- --check

  # The release gate: everything above MSRV must build and pass tests
  # with default features, independent of optional feature readiness.
  lint:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: clippy
        override: true
    - uses: Swatinem/rust-cache@v2
    # `full` is a superset of the default `math` feature, so this pass
    # covers the base code plus every pg-functions category.
    - name: Lint
      run: cargo clippy --features datafusion-pg-functions/full -- -D warnings

  # Advisory: lints the optional postgis feature as well. Allowed to fail
  # so a lagging geodatafusion release does not block anything.
  lint-all-features:
    name: Clippy lint (all features)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: clippy
        override: true
    - uses: Swatinem/rust-cache@v2
    - name: Lint
      run: cargo clippy --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [stable, nightly]
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: nightly
            os: ubuntu-latest
            rust: nightly
    steps:
    - uses: actions/checkout@v6
    - uses: insightsengineering/disk-space-reclaimer@v1
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        override: true
    - uses: Swatinem/rust-cache@v2
    - name: Build and run tests
      run: cargo test

  # Additional features, each tested in isolation. Feature sets backed by
  # fast-moving optional dependencies (postgis -> geodatafusion) are marked
  # `optional` so they cannot block a release while upstream lags behind.
  test-features:
    name: Test features (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: functions-full
            flags: "--features datafusion-pg-functions/full"
            optional: false
          - name: postgis
            flags: "--features datafusion-postgres/postgis"
            optional: true
          - name: all-features
            flags: "--all-features"
            optional: true
    steps:
    - uses: actions/checkout@v6
    - uses: insightsengineering/disk-space-reclaimer@v1
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - uses: Swatinem/rust-cache@v2
    - name: Build and run tests
      run: cargo test ${{ matrix.flags }}

  cleanbuild-linux-nix:
    name: Run clean build on Linux
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: insightsengineering/disk-space-reclaimer@v1
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command cargo test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
    - uses: actions/checkout@v6
    - uses: insightsengineering/disk-space-reclaimer@v1
    - uses: cachix/install-nix-action@v31
    - name: Initialize podman
      run: nix develop --command podman info >/dev/null 2>&1 || true
    - run: |
        cd tests-integration
        nix develop --command bash test.sh --skip-postgis

  # Advisory: full integration suite including the PostGIS tests, built
  # with the postgis feature. Allowed to fail while geodatafusion lags.
  integration-postgis:
    name: Integration tests (postgis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
    - uses: insightsengineering/disk-space-reclaimer@v1
    - uses: cachix/install-nix-action@v31
    - name: Initialize podman
      run: nix develop --command podman info >/dev/null 2>&1 || true
    - run: |
        cd tests-integration
        nix develop --command bash test.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: "1.94"
        override: true
    - uses: Swatinem/rust-cache@v2
    - run: cargo build
